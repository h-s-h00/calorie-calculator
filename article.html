<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="brand-mark__track"/><circle cx="22" cy="22" r="18" class="brand-mark__fill"/></svg>

<!-- ════════════════════ AD SLOT — لافتة أعلى الصفحة ════════════════════ -->
<div class="wrap">
  <div class="ad-slot ad-slot--leaderboard" aria-hidden="true">
    <span class="ad-slot__tag">مساحة إعلانية</span>
  </div>
</div>

<main class="wrap">
  <p class="breadcrumb"><a href="blog.html">المقالات</a> ← <span id="breadcrumb-title"></span></p>

  <div id="article-container">
    <!-- يُملأ تلقائياً بالجافاسكربت -->
  </div>

  <div id="not-found" class="not-found" hidden>
    <h1>المقال غير موجود</h1>
    <p>يبدو أن هذا المقال غير متوفر أو تم نقله.</p>
    <a href="blog.html" class="btn">الرجوع لكل المقالات</a>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <p>© <span id="year"></span> جميع الحقوق محفوظة.</p>
  </div>
</footer>

<script src="articles-data.js"></script>
<script>
(function () {
  "use strict";

  function getSlug() {
    var params = new URLSearchParams(window.location.search);
    return params.get("slug");
  }

  var slug = getSlug();
  var articles = window.ARTICLES || [];
  var article = articles.find(function (a) { return a.slug === slug; });

  var container = document.getElementById("article-container");
  var notFound = document.getElementById("not-found");

  if (!article) {
    container.hidden = true;
    notFound.hidden = false;
  } else {
    document.getElementById("page-title").textContent = article.title + " | حاسبة السعرات الحرارية";
    document.getElementById("page-description").setAttribute("content", article.excerpt || "");
    document.getElementById("breadcrumb-title").textContent = article.title;

    var head = document.createElement("div");
    head.className = "article-head";
    head.innerHTML =
      '<p class="article-head__meta">' + article.date + (article.readTime ? " · " + article.readTime : "") + '</p>' +
      '<h1>' + article.title + '</h1>';

    var body = document.createElement("div");
    body.className = "article-body";
    body.innerHTML = article.contentHtml || "";

    var adMid = document.createElement("div");
    adMid.className = "ad-slot ad-slot--in-article";
    adMid.setAttribute("aria-hidden", "true");
    adMid.innerHTML = '<span class="ad-slot__tag">مساحة إعلانية</span>';

    container.appendChild(head);
    container.appendChild(body);
    container.appendChild(adMid);

    // مقالات ذات صلة (حتى ٣، غير المقال الحالي)
    var others = articles.filter(function (a) { return a.slug !== article.slug; }).slice(0, 3);
    if (others.length > 0) {
      var related = document.createElement("div");
      related.className = "related";
      var list = others.map(function (a) {
        return '<a href="article.html?slug=' + encodeURIComponent(a.slug) + '">' + a.title + "</a>";
      }).join("");
      related.innerHTML = "<h2>مقالات ذات صلة</h2><div class=\"related-list\">" + list + "</div>";
      container.appendChild(related);
    }
  }

  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
