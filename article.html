<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta id="page-description" name="description" content="">

<!-- Google AdSense — كود التحقق من الملكية -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4777858178569282"
     crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16221F; --muted:#5B6864; --paper:#F7F4EC; --card:#FFFFFF;
  --deep:#123832; --deep-2:#0D2B26; --deep-tint:#E4EEEC; --line:rgba(18,56,50,.14);
  --amber:#E8A33D; --amber-deep:#C97F1E;
  --font-display:'Reem Kufi', system-ui, sans-serif;
  --font-body:'IBM Plex Sans Arabic', system-ui, sans-serif;
  --radius-lg:22px; --radius-sm:9px; --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:24px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.site-header{position:sticky;top:0;z-index:100;background:var(--deep);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.brand-mark{width:34px;height:34px;flex:none}
.brand-mark svg{width:100%;height:100%}
.brand-mark__track{fill:none;stroke:rgba(255,255,255,.25);stroke-width:4}
.brand-mark__fill{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-dasharray:113;stroke-dashoffset:34;transform-origin:center;transform:rotate(-90deg)}
.brand-text{font-family:var(--font-display);font-size:1.15rem;font-weight:700}
.brand-text em{font-style:normal;color:var(--amber)}
.site-nav{display:flex;gap:22px;font-size:.95rem;flex-wrap:wrap}
.site-nav a{text-decoration:none;opacity:.85;padding-block:4px;border-bottom:2px solid transparent;transition:opacity .2s,border-color .2s}
.site-nav a:hover,.site-nav a[aria-current="page"]{opacity:1;border-color:var(--amber)}

.ad-slot{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg, rgba(18,56,50,.05) 0 10px, rgba(18,56,50,.02) 10px 20px);border:1.5px dashed var(--line);border-radius:var(--radius-sm);color:var(--muted);margin-block:36px;min-height:90px}
.ad-slot__tag{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.ad-slot--leaderboard{max-width:970px;margin-inline:auto}
.ad-slot--in-article{min-height:250px}

.breadcrumb{padding-block:22px 0;font-size:.88rem;color:var(--muted)}
.breadcrumb a{color:var(--deep);text-decoration:underline}

.article-head{padding-block:14px 10px}
.article-head__meta{font-size:.85rem;color:var(--amber-deep);font-weight:600;margin-bottom:10px}
.article-head h1{font-family:var(--font-display);color:var(--deep-2);font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 .3em;line-height:1.3}

.article-body{max-width:760px;margin-inline:auto;padding-block:20px 10px}
.article-body h2{font-family:var(--font-display);color:var(--deep-2);font-size:1.3rem;margin-top:1.6em}
.article-body p{margin:0 0 1.1em;color:var(--ink)}
.article-body ul{margin:0 0 1.1em;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.article-body strong{color:var(--deep-2)}

.not-found{text-align:center;padding-block:60px;max-width:520px;margin-inline:auto}
.not-found h1{font-family:var(--font-display);color:var(--deep-2);font-size:1.6rem}
.not-found p{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;padding:12px 26px;border-radius:999px;background:var(--amber);color:var(--deep-2);text-decoration:none;margin-top:10px}

.related{max-width:760px;margin:40px auto 0;border-top:1px solid var(--line);padding-top:30px}
.related h2{font-family:var(--font-display);color:var(--deep-2);font-size:1.2rem}
.related-list{display:flex;flex-direction:column;gap:14px}
.related-list a{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px;text-decoration:none;color:var(--ink);font-weight:600;transition:border-color .18s}
.related-list a:hover{border-color:var(--amber)}

.site-footer{background:var(--deep-2);color:rgba(255,255,255,.8);margin-top:40px}
.footer-bottom{padding-block:18px 28px}
.footer-bottom p{margin:0;font-size:.82rem;color:rgba(255,255,255,.5);text-align:center}

@media (max-width:560px){
  .header-inner{justify-content:center;text-align:center}
  .site-nav{width:100%;justify-content:center}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" class="brand-mark__track"/><circle cx="22" cy="22" r="18" class="brand-mark__fill"/></svg>
      </span>
      <span class="brand-text">حاسبة<em>السعرات</em></span>
    </a>
    <nav class="site-nav" aria-label="التنقل الرئيسي">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#calculator">الحاسبة</a>
      <a href="blog.html" aria-current="page">المقالات</a>
      <a href="privacy.html">سياسة الخصوصية</a>
    </nav>
  </div>
</header>

<!-- ════════════════════ AD SLOT — لافتة أعلى الصفحة ════════════════════ -->
<div class="wrap">
  <div class="ad-slot ad-slot--leaderboard" aria-hidden="true">
    <span class="ad-slot__tag">مساحة إعلانية</span>
  </div>
</div>

<main class="wrap">
  <p class="breadcrumb"><a href="blog.html">المقالات</a> ← <span id="breadcrumb-title"></span></p>

  <div id="article-container">
    <!-- يُملأ تلقائياً بالجافاسكربت -->
  </div>

  <div id="not-found" class="not-found" hidden>
    <h1>المقال غير موجود</h1>
    <p>يبدو أن هذا المقال غير متوفر أو تم نقله.</p>
    <a href="blog.html" class="btn">الرجوع لكل المقالات</a>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-bottom">
    <p>© <span id="year"></span> جميع الحقوق محفوظة.</p>
  </div>
</footer>

<script src="articles-data.js"></script>
<script>
(function () {
  "use strict";

  function getSlug() {
    var params = new URLSearchParams(window.location.search);
    return params.get("slug");
  }

  var slug = getSlug();
  var articles = window.ARTICLES || [];
  var article = articles.find(function (a) { return a.slug === slug; });

  var container = document.getElementById("article-container");
  var notFound = document.getElementById("not-found");

  if (!article) {
    container.hidden = true;
    notFound.hidden = false;
  } else {
    document.getElementById("page-title").textContent = article.title + " | حاسبة السعرات الحرارية";
    document.getElementById("page-description").setAttribute("content", article.excerpt || "");
    document.getElementById("breadcrumb-title").textContent = article.title;

    var head = document.createElement("div");
    head.className = "article-head";
    head.innerHTML =
      '<p class="article-head__meta">' + article.date + (article.readTime ? " · " + article.readTime : "") + '</p>' +
      '<h1>' + article.title + '</h1>';

    var body = document.createElement("div");
    body.className = "article-body";
    body.innerHTML = article.contentHtml || "";

    var adMid = document.createElement("div");
    adMid.className = "ad-slot ad-slot--in-article";
    adMid.setAttribute("aria-hidden", "true");
    adMid.innerHTML = '<span class="ad-slot__tag">مساحة إعلانية</span>';

    container.appendChild(head);
    container.appendChild(body);
    container.appendChild(adMid);

    // مقالات ذات صلة (حتى ٣، غير المقال الحالي)
    var others = articles.filter(function (a) { return a.slug !== article.slug; }).slice(0, 3);
    if (others.length > 0) {
      var related = document.createElement("div");
      related.className = "related";
      var list = others.map(function (a) {
        return '<a href="article.html?slug=' + encodeURIComponent(a.slug) + '">' + a.title + "</a>";
      }).join("");
      related.innerHTML = "<h2>مقالات ذات صلة</h2><div class=\"related-list\">" + list + "</div>";
      container.appendChild(related);
    }
  }

  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
