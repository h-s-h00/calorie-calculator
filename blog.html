<script src="articles-data.js"></script>
<script>
(function () {
  "use strict";
  var grid = document.getElementById("articles-grid");
  var articles = (window.ARTICLES || []).slice().sort(function (a, b) {
    return new Date(b.date) - new Date(a.date);
  });

  if (articles.length === 0) {
    grid.innerHTML = '<p class="empty-state">No articles published yet.</p>';
  } else {
    articles.forEach(function (a) {
      var card = document.createElement("a");
      card.className = "article-card";
      card.href = "article.html?slug=" + encodeURIComponent(a.slug);

      var meta = document.createElement("span");
      meta.className = "article-card__meta";
      meta.textContent = a.date + (a.readTime ? " · " + a.readTime : "");

      var title = document.createElement("h2");
      title.textContent = a.title;

      var excerpt = document.createElement("p");
      excerpt.textContent = a.excerpt || "";

      var cta = document.createElement("span");
      cta.className = "article-card__cta";
      cta.textContent = "Read More →";

      card.appendChild(meta);
      card.appendChild(title);
      card.appendChild(excerpt);
      card.appendChild(cta);
      grid.appendChild(card);
    });
  }

  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();
})();
</script>
